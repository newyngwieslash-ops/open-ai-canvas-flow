      summary: 查询任务或按项目恢复手动图片候选
      description: 候选模式在 limit 前过滤；created_at DESC,id DESC 游标分页，包含 pending_confirmation 和 adopted。返回 TaskSummary 数组，保留 previewUrl，新增 assetImageCandidate（assetId、baseVersionId、state、可选 adoptedVersionId）。不足 pageSize 表示结束。候选查询必须提供 projectId，禁止 activeOnly=true。非候选模式支持 projectId + activeOnly=true + assetId 查询指定资产的 queued/running 图片任务；先校验项目和资产归属及关联，再按对应 operation 的目标 ID 或精确 nodeId 在 limit 前过滤，返回同一 TaskSummary 数组；不接受 beforeTaskId 或 workbenchKind。
      parameters:
        - {in: query, name: projectId, schema: {type: string}}
        - {in: query, name: assetImageCandidates, schema: {type: boolean, default: false}}
        - {in: query, name: assetId, schema: {type: string}, description: 候选目标资产筛选，或与 projectId、activeOnly=true 组合查询目标资产活动任务}
        - {in: query, name: beforeTaskId, schema: {type: string}, description: 上页末任务 ID；必须属于同一查询范围}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {in: query, name: activeOnly, schema: {type: boolean, default: false}}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      tags: [tasks]
      summary: 创建生成任务
      description: 项目图片 input.metadata.operation 为 character_turnaround 或 project_asset_image。adoptionMode=manual|auto，缺省 auto，未知值拒绝。manual 要求 projectAssetVersionId 和 referenceSource=original|current|none，角色目标 characterAssetId，场景道具目标 projectAssetId。仅单参考单输出，服务端核实来源及参考图能力；manual 成功只保存 assetImageCandidate，不自动采用。角色生成只产生三视图。当账号排队或运行中的任务达到 activeTaskLimit 时返回 HTTP 400（code=400, reason=task_active_limit_exceeded，未入队且未预占积分）；触发创建频率限制时返回 HTTP 429（code=42901, reason=rate_limited）。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /tasks/{id}/retry:
    post:
      tags: [tasks]
      summary: 按原任务 ID 重新入队失败或已取消任务
      description: 仅当前用户归属且满足重试条件的 failed/cancelled 任务可重新入队。当账号排队或运行中的任务达到 activeTaskLimit 时返回 HTTP 400（code=400, reason=task_active_limit_exceeded，未入队且未预占积分）；其余参数或状态不满足时返回 HTTP 400（reason=invalid_argument）。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /tasks/{id}/recover-media:
    post:
      tags: [tasks]
      summary: 按原任务 ID 重试作品保存，不重新生成或创建计费订单
      description: 仅当前用户有恢复记录的保存失败任务可重入队；已在队列或运行中时幂等返回。每任务最多手动恢复三次，间隔至少一分钟。已取消、已退款或归属项目不可用时拒绝。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /tasks/{id}/text-events:
    get:
      tags: [tasks]
      summary: 文本任务 SSE
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: integer }
          description: 递增事件游标，不要用任务 ID
      responses:
        "200":
          description: text/event-stream
  /assets:
    get:
      tags: [assets]
      summary: 用户素材库
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /assets/batch-delete:
    post:
      tags: [assets]
      summary: 批量彻底删除当前用户素材
      description: 顶层 JSON 数组，一次请求、一个数据库事务。所有 ID 必须属于当前用户，不受任务、画布或历史引用阻塞；共享文件保留，其余通过 Outbox 异步清理，失败重试。任一素材不存在、越权或数据库写入失败时整批不删除。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 1000
              items:
                type: string
                minLength: 1
            example: ["asset-1", "asset-2"]
      responses:
        "200":
          description: 成功信封，data.ids 返回本次请求的素材 ID 数组；物理文件清理由后台执行。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ids]
                        properties:
                          ids:
                            type: array
                            items: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /assets/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    delete:
      tags: [assets]
      summary: 彻底删除当前用户素材
      description: 不依赖素材 archived 状态，也不受画布、任务、项目或历史快照引用阻塞；其他素材共享的物理对象仍保留。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    AgentRunID:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: open_ai_canvas_session
  schemas:
    BindingVersionBaseline:
      type: object
      required: [assetVersionId, versionFingerprint, mediaFingerprint, bindable, missingImage]
      properties:
        assetVersionId: {type: string}
        versionFingerprint: {type: string}
        mediaFingerprint: {type: string}
        bindable: {type: boolean}
        missingImage: {type: boolean}
    BindingCatalogBaseline:
      type: object
      required: [assetId, assetFingerprint, linkFingerprint, versions]
      properties:
        assetId: {type: string}
        assetFingerprint: {type: string}
        linkFingerprint: {type: string}
        versions: {type: array, items: {$ref: '#/components/schemas/BindingVersionBaseline'}}
    BindingReference:
      type: object
      required: [referenceId, assetVersionId, role, status]
      properties:
        referenceId: {type: string}
        assetVersionId: {type: string}
        role: {type: string, description: 引用角色；存量镜头追加写入固定为 "reference"}
        status: {type: string, description: 引用状态；有效及新追加的镜头资产引用固定为 "linked"}
    BindingArtifact:
      type: object
      required: [artifactId, contentFingerprint, status, selected]
      properties:
        artifactId: {type: string}
        contentFingerprint: {type: string}
        status: {type: string, description: 产物状态；镜头发生真实新增引用后全部非 failed 产物更新为 "stale"，failed 产物保持 "failed"}
        selected: {type: boolean, description: 是否当前选中；镜头发生真实新增引用后全部产物更新为 false（取消选中），未新增引用的镜头保持不变}
    BindingShotBaseline:
      type: object
      required: [shotId, shotFingerprint, revisionFingerprint, references, artifacts]
      properties:
        shotId: {type: string}
        shotFingerprint: {type: string}
        revisionFingerprint: {type: string}
        references: {type: array, items: {$ref: '#/components/schemas/BindingReference'}}
        artifacts: {type: array, items: {$ref: '#/components/schemas/BindingArtifact'}}
    BindingBaseline:
      type: object
      description: 不可信客户端必须原样回传的完整并发基线；shotIds 与 shots 按 shotId 升序且一一对应（1..100），catalog 按 assetId 升序且包含无版本资产，versions 按 assetVersionId 升序。
      required: [projectId, unitId, projectRevision, shotIds, shots, catalog]
      properties:
        projectId: {type: string}
        unitId: {type: string}
        projectRevision: {type: integer, format: int64}
        shotIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string}}
        shots: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/BindingShotBaseline'}}
        catalog: {type: array, items: {$ref: '#/components/schemas/BindingCatalogBaseline'}}
    BindingPreviewRequest:
      type: object
      description: 待预览镜头 ID 列表；服务端 TrimSpace 并去重后要求数量在 1..100 范围内。
      required: [shotIds]
      properties:
        shotIds: {type: array, minItems: 1, items: {type: string}}
    BindingShotPreview:
      type: object
      required: [shotId, existingReferences, candidates, issues, existingVersionCount, remainingCapacity]
      properties:
        shotId: {type: string}
        existingReferences: {type: array, items: {$ref: '#/components/schemas/BindingReference'}}
        candidates: {type: array, items: {$ref: '#/components/schemas/BindingCandidate'}}
        issues: {type: array, items: {$ref: '#/components/schemas/BindingIssue'}}
        existingVersionCount: {type: integer, minimum: 0}
        remainingCapacity: {type: integer, minimum: 0, maximum: 6}
    BindingPreview:
      type: object
      required: [baseline, shots]
      properties:
        baseline: {$ref: '#/components/schemas/BindingBaseline'}
        shots: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/BindingShotPreview'}}
    BindingSelection:
      type: object
      description: 单镜头待追加的资产版本选择；服务端按镜头去重后与已有版本合并计数不得超过 6，空数组表示该镜头本次不追加。
      required: [shotId, assetVersionIds]
      properties:
        shotId: {type: string}
        assetVersionIds: {type: array, items: {type: string}}
    BindingAppendRequest:
      type: object
      description: 必须携带完整 baseline，且 selections 必须覆盖 baseline.shotIds 全部镜头（未改动镜头传 assetVersionIds=[]）；同一 shotId 若重复出现且去重后版本集合不一致则以 400 拒绝。
      required: [baseline, selections]
      properties:
        baseline: {$ref: '#/components/schemas/BindingBaseline'}
        selections: {type: array, minItems: 1, items: {$ref: '#/components/schemas/BindingSelection'}}
    BindingShotAppendResult:
      type: object
      required: [shotId, addedCount, addedVersionIds, unchanged, references, artifacts]
      properties:
        shotId: {type: string}
        addedCount: {type: integer, minimum: 0}
        addedVersionIds: {type: array, items: {type: string}}
        unchanged: {type: boolean}
        references: {type: array, items: {$ref: '#/components/schemas/BindingReference'}}
        artifacts: {type: array, items: {$ref: '#/components/schemas/BindingArtifact'}}
    BindingAppendResult:
      type: object
      required: [projectRevision, unchanged, addedCount, shots]
      properties:
        projectRevision: {type: integer, format: int64}
        unchanged: {type: boolean}
        addedCount: {type: integer, minimum: 0}
        shots: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/BindingShotAppendResult'}}
    GeneratedBindingBaseline:
      type: object
      description: 完整原样回传；含无版本资产及全部目录/版本/媒体指纹，不得仅提交所选子集。
      required: [projectId, unitId, projectRevision, taskId, taskResultFingerprint, catalog]
      properties:
        projectId: {type: string}
        unitId: {type: string}
        projectRevision: {type: integer, format: int64}
        taskId: {type: string}
        taskResultFingerprint: {type: string}
        catalog: {type: array, items: {$ref: '#/components/schemas/BindingCatalogBaseline'}}
    BindingIssue:
      type: object
      required: [kind, message]
      properties:
        kind: {type: string, enum: [invalid_id, category_mismatch, not_allowed, ambiguous, unmatched, missing_version, missing_image, capacity_exceeded, context_warning]}
        message: {type: string}
    BindingEvidence:
      type: object
      description: Unicode code-point 半开区间；结构化无文本区间为 0/0。
      required: [kind, field, start, end, text]
      properties:
        kind: {type: string, enum: [structured_id, exact_name, visual_label, structured_continuity, mention, speaker]}
        field: {type: string}
        start: {type: integer, minimum: 0}
        end: {type: integer, minimum: 0}
        text: {type: string}
    BindingCandidate:
      type: object
      required: [assetId, category, name, assetVersionId, evidence, issues, bindable, missingImage, defaultSelected]
      properties:
        assetId: {type: string}
        category: {type: string, description: 合法类别为 character/environment/prop；类别错误的候选保留模型原值并返回 category_mismatch}
        name: {type: string}
        assetVersionId: {type: string, nullable: true}
        evidence: {type: array, items: {$ref: '#/components/schemas/BindingEvidence'}}
        issues: {type: array, items: {$ref: '#/components/schemas/BindingIssue'}}
        bindable: {type: boolean}
        missingImage: {type: boolean}
        defaultSelected: {type: boolean}
    GeneratedBindingRow:
      type: object
      description: 解析可返回超过六个合法版本；保存前必须真实选择至多六个。
      required: [rowIndex, candidates, assetVersionIds, issues]
      properties:
        rowIndex: {type: integer, minimum: 0}
        candidates: {type: array, items: {$ref: '#/components/schemas/BindingCandidate'}}
        assetVersionIds: {type: array, uniqueItems: true, items: {type: string}}
        issues: {type: array, items: {$ref: '#/components/schemas/BindingIssue'}}
    GeneratedBindingResolution:
      type: object
      required: [taskId, baseline, rows]
      properties:
        taskId: {type: string}
        baseline: {$ref: '#/components/schemas/GeneratedBindingBaseline'}
        rows: {type: array, items: {$ref: '#/components/schemas/GeneratedBindingRow'}}
    GeneratedBindingInput:
      type: object
      description: rowIndices 与 shots 等长且索引对应真实任务行；任务 ID 必须与基线一致。
      required: [taskId, baseline, rowIndices]
      properties:
        taskId: {type: string}
        baseline: {$ref: '#/components/schemas/GeneratedBindingBaseline'}
        rowIndices: {type: array, uniqueItems: true, items: {type: integer, minimum: 0}}
    StoryboardProjectAssetRef:
      type: object
      description: 模型输出字段 projectAssetRefs；合法示例 assetId=asset-1/category=character（真实目录存在时）；非法示例 unknown ID 即使 name 精确匹配也不兜底。名称仅 TrimSpace 后同类精确唯一匹配。
      required: [category]
      properties:
        assetId: {type: string}
        category: {type: string, enum: [character, environment, prop]}
        name: {type: string}
    StoryboardShotRevisionInput:
      type: object
      properties:
        plotDescription: {type: string}
        action: {type: string}
        dialogue: {type: string}
        shotSize: {type: string}
        cameraAngle: {type: string}
        cameraMovement: {type: string}
        imagePrompt: {type: string}
        videoPrompt: {type: string}
        negativePrompt: {type: string}
        continuityNotes: {type: string}
        durationMs: {type: integer, format: int64}
        actionBeats: {type: array, items: {type: object, additionalProperties: true}}
    StoryboardReplaceShotInput:
      type: object
      description: 生成保存要求脚本与对应真实任务行完整一致；title 与 description 经 TrimSpace 后必须非空，durationMs 非负；容量按不同版本计数，重复输入由服务端去重。
      required: [title, description]
      properties:
        id: {type: string}
        unitId: {type: string}
        title: {type: string, minLength: 1, description: TrimSpace 后非空}
        description: {type: string, minLength: 1, description: TrimSpace 后非空}
        status: {type: string}
        position: {type: integer}
        durationMs: {type: integer, format: int64, minimum: 0}
        revision: {$ref: '#/components/schemas/StoryboardShotRevisionInput'}
        assetVersionIds: {type: array, items: {type: string}, description: 去重后至多六个不同版本；重复输入由服务端去重}
    ReplaceProjectUnitShotsInput:
      type: object
      description: shots 必填且数量为 1..200；generatedBinding 可省略以保持人工合同；生成路径须显式提交 expectedShotIds（空章节为 []）。
      required: [shots]
      properties:
        shots: {type: array, minItems: 1, maxItems: 200, items: {$ref: '#/components/schemas/StoryboardReplaceShotInput'}}
        expectedShotIds: {type: array, items: {type: string}}
        generatedBinding: {$ref: '#/components/schemas/GeneratedBindingInput'}
    StoryboardReferencedVersion:
      type: object
      description: workspace 的 referencedVersion；referenceImage 可省略，只返回校验后的绑定版本原图，缺失不得回退当前 head。
      required: [id, assetId, version, representations]
      properties:
        id: {type: string}
        assetId: {type: string}
        version: {type: integer}
        representations: {type: array, items: {type: object}}
        referenceImages: {type: array, maxItems: 16, items: {type: object, required: [resourceId], properties: {resourceId: {type: string}}}}
        referenceImage: {type: object, required: [resourceId], properties: {resourceId: {type: string}}}
    LoginLog:
      type: object
      properties:
        id: {type: string}
        userId: {type: string, nullable: true}
        username: {type: string, description: 事件时用户名快照}
        displayName: {type: string}
        account: {type: string, description: 用户名或脱敏的尝试账号}
        event: {type: string, enum: [login, logout]}
        method: {type: string, enum: [password, email, sms, linuxdo, verification, unknown]}
        source: {type: string, enum: [login, registration, logout]}
        result: {type: string, enum: [success, failed]}
        ip: {type: string}
        userAgent: {type: string, maxLength: 512, description: 客户端自报信息，不作为身份判断依据}
        sessionRef: {type: string, description: 会话 ID 的单向哈希，仅关联历史事件，不含 Token}
        reason: {type: string}
        message: {type: string}
        createdAt: {type: string, format: date-time}
    ToolMutation:
      type: object
      required: [type, label, prompt]
      properties:
        type: {type: string, enum: [style, motion, nine_grid, effect]}
        label: {type: string, description: 名称最多 120 字节}
        prompt: {type: string, description: 最多 8000 字节，不允许嵌套工具标签}
        visibility: {type: string, enum: [private, public], default: private}
        desc: {type: string}
        tag: {type: string}
        cover: {type: string, description: 本人已上传完成的资源 URL，仅限私有工具}
        mediaUrl: {type: string, description: 本人已上传完成的资源 URL，仅限私有工具}
        extraInfo: {type: array, items: {type: string}}
        ratio: {type: string}
    ModelRequestIntent:
      type: object
      required: [capability]
      properties:
        capability:
          type: string
          enum: [text, image, video, audio]
        operation:
          type: string
          description: 可选生成操作，必须符合所选模型的能力合同
        inputs:
          type: object
          description: 按素材类型统计的参考数量，如 image、video、audio；另受所选模型的数量上限约束
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 128
        options:
          type: object
          description: 当前创作规格；未指定的参数使用服务端默认值
          additionalProperties: true
          example:
            vquality: 720p
            size: "16:9"
            videoSeconds: 5
            videoGenerateAudio: true
    LogicalModelQuote:
      type: object
      required: [logicalModelId, billingMode, quantity, amountMicrocredits, estimated]
      properties:
        logicalModelId:
          type: string
          description: 前台逻辑模型 ID；直接查询系统渠道模型时为空字符串
        billingMode:
          type: string
          enum: [fixed_request, per_second, token]
        quantity:
          type: integer
          format: int64
          minimum: 1
          description: 按次为 1，按秒为生成秒数，按 Token 为预留用量（视频含平台预留余量）
        amountMicrocredits:
          type: integer
          format: int64
          minimum: 0
          description: 预估预留微积分，1000000 微积分等于 1 积分；明确配置的免费价格返回 0
        estimated:
          type: boolean
          description: Token 计费为 true；优先有效上游 usage，视频无有效用量时按提交的公式快照结算，预留不构成费用上限
        videoTokenEstimate:
          $ref: "#/components/schemas/VideoTokenEstimate"
    VideoTokenEstimate:
      type: object
      description: 仅视频 Token 报价返回；将火山公式用量和平台预留余量分开披露
      required: [formulaTokens, reservedTokens, outputWidth, outputHeight, framesPerSecond, outputSeconds, referenceSeconds, referenceDurationEstimated, dimensionsEstimated, reservationMarginPercent]
      properties:
        formulaTokens:
          type: integer
          format: int64
          minimum: 1
          description: 按（参考视频总秒数 + 输出秒数）× 输出宽 × 输出高 × 帧率 / 1024 向上取整；上游最低计费用量可能更高
        reservedTokens:
          type: integer
          format: int64
          minimum: 1
          description: 公式用量叠加平台预留余量后向上取整
        outputWidth:
          type: integer
          format: int64
          minimum: 1
        outputHeight:
          type: integer
          format: int64
          minimum: 1
        framesPerSecond:
          type: integer
          format: int64
          minimum: 1
        outputSeconds:
          type: integer
          format: int64
          minimum: 1
        referenceSeconds:
          type: number
          format: double
          minimum: 0
          description: 计入公式的参考视频总秒数；报价仅有参考数量时采用预估时长
        referenceDurationEstimated:
          type: boolean
          description: 参考时长未知、使用预估值时为 true
        dimensionsEstimated:
          type: boolean
          description: 自适应画幅或上游型号无法确定，使用预估像素尺寸时为 true
        reservationMarginPercent:
          type: integer
          format: int64
          minimum: 0
          description: 平台预留余量百分比，不属于火山官方计费公式
    ModelQuoteEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [data]
          properties:
            code:
              type: integer
              enum: [0]
            data:
              type: object
              required: [quote]
              properties:
                quote:
                  $ref: "#/components/schemas/LogicalModelQuote"
    AgentProfileRequest:
      type: object
      additionalProperties: false
      required: [scope, content, revision]
      properties:
        scope:
          type: string
          enum: [user, project, canvas]
        projectId:
          type: string
        canvasId:
          type: string
        content:
          type: string
          description: 常驻偏好文档，最多 12000 个 Unicode 字符；不能授权节点、工具、预算或绕过审批
        revision:
          type: integer
          minimum: 0
          description: 待更新层的数字 revision；首次创建为 0
    CloudAgentRequest:
      type: object
      additionalProperties: false
      required: [prompt, permissionMode, contextScope, budget, idempotencyKey]
      properties:
        canvasId:
          type: string
          maxLength: 80
          description: 可选。为空时是平台级对话：不占画布锁、只开放无画布工具，contextScope 和 focusNodeIds 必须为空。续轮可换绑画布，服务端会注入换绑说明。
        prompt:
          type: string
          description: 非空，最多 16000 字节
        logicalModelId:
          type: string
        model:
          type: string
        channelId:
          type: string
        channelModelKey:
          type: string
        permissionMode:
          type: string
          enum: [read_only, request_approval, auto]
        reasoningMode:
          type: string
          enum: [off, auto, deep]
          description: 本轮推理策略；供应商是否支持由后端校验
        profileRevision:
          type: string
          description: GET /agent/profile 的生效合并 revision；变化时拒绝创建新轮次
        skillIds:
          type: array
          maxItems: 8
          items:
            type: string
        contextScope:
          type: array
          maxItems: 1
          items:
            type: string
            enum: [canvas]
        budget:
          type: object
          additionalProperties: false
          required: [maxCredits]
          properties:
            maxCredits:
              type: number
              minimum: 0
              exclusiveMinimum: true
              maximum: 1000000
            maxGenerationTasks:
              type: integer
              minimum: 0
              maximum: 8
            maxVideoSeconds:
              type: integer
              minimum: 0
              maximum: 120
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
    Envelope:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 0 成功；失败时默认等于 HTTP 状态，或 status*100+n 的细分码
        data: {}
        msg:
          type: string
        reason:
          type: string
          description: 仅失败时出现。稳定机器可读原因。
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            code:
              type: integer
              enum: [400, 401, 403, 404, 409, 422, 429, 500, 502, 503, 504, 40301, 40901, 42201, 42202, 42901]
            data:
              nullable: true
            reason:
              type: string
              enum:
                - invalid_argument
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - project_name_conflict
                - failed_precondition
                - quota_exceeded
                - rate_limited
                - unavailable
                - timeout
                - internal
                - bad_gateway
                - upstream_dns_failed
                - model_capability_not_supported
                - model_price_not_configured
                - model_route_unavailable
                - provider_request_failed
                - model_catalog_mismatch
                - invalid_model_selection
                - storyboard_asset_binding_invalid_request
                - storyboard_asset_binding_invalid_reference
                - storyboard_asset_binding_capacity_exceeded
                - storyboard_asset_binding_conflict
                - storyboard_asset_binding_busy
                - task_active_limit_exceeded
  responses:
    ModelQuote:
      description: 当前参数对应的费用报价，位于信封 data.quote
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ModelQuoteEnvelope"
    Envelope:
      description: 业务成功信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Error:
      description: 业务失败信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
