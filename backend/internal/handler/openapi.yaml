openapi: 3.0.3
info:
  title: 源铭振跃 (YMZY) HTTP API
  version: "1.0.0"
  description: |
    路径前缀是 `/api`。前后端一起发布，不按路径做 API 版本。

    业务 JSON 信封为 `{ code, data, msg, reason }`。`code === 0` 表示成功；失败时 HTTP status 与
    `code` 都表达失败。`code` 默认等于 HTTP 状态；同一状态下的细分原因使用 `status*100+n`
    （例如 40301 配额、42901 限流）。机器判断请用 `reason`，不要解析 `msg`。

    TypeScript 调用面仍是 `web/src/services/api` 的 `http` 模块，不从本规范生成客户端。
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: meta
  - name: auth
  - name: projects
  - name: canvas
  - name: resources
  - name: tasks
  - name: assets
  - name: models
  - name: agent
  - name: admin
  - name: skills
  - name: workbench
paths:
  /projects/{id}/units/{unitId}/shot-asset-bindings/resolve-generated:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: path, name: unitId, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 只读解析真实已成功章节分镜任务
      description: |
        64 KiB 请求体上限；taskId 不替代登录与资源归属校验。
        核验 owner/project/unit、canvas_text、storyboard、mode=text、succeeded 与服务端允许集合。
        返回完整目录基线及全部合法版本；超过六个不得默认取前六个。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId]
              properties:
                taskId: {type: string, minLength: 1}
            example: {taskId: task-1}
      responses:
        "200":
          description: 只读成功；不创建模型任务或写入引用
          content:
            application/json:
              schema:
                type: object
                required: [code, data, msg]
                properties:
                  code: {type: integer, enum: [0]}
                  msg: {type: string}
                  data: {$ref: '#/components/schemas/GeneratedBindingResolution'}
        "400": {description: invalid_argument，任务/结果格式/范围不符}
        "401": {description: unauthorized}
        "404": {description: not_found，项目、章节或生成任务不存在或不属于当前用户}
        "500": {description: internal}
  /projects/{id}/units/{unitId}/shot-asset-bindings/preview:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: path, name: unitId, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 只读计算章节存量镜头的资产候选、现有引用、诊断问题及并发基线
      description: |
        64 KiB 请求体上限；只读，不创建模型任务、不写入引用、不使产物失效。
        shotIds 按 TrimSpace 去重后须为 1..100 个不同镜头；核验当前用户对项目、章节与全部目标镜头的归属。
        基线 shotIds 与 shots 按 shotId 升序且一一对应，catalog 按 assetId 升序且包含无版本资产，版本按 assetVersionId 升序；shots[].candidates 返回全部匹配候选，计算 existingVersionCount 与 remainingCapacity = max(0, 6 - existingVersionCount) 时将候选 assetVersionId 与 existingReferences 去重合并，合并不同版本数超过 6 时候选 defaultSelected 全部置为 false 并附加 capacity_exceeded（前端抽屉在组装 selections 时过滤已绑定版本，append 亦按集合差去重）。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BindingPreviewRequest'}
            example: {shotIds: [shot-1, shot-2]}
      responses:
        "200":
          description: 只读预览成功；返回不可信客户端须原样回传的完整基线及按请求顺序排列的镜头预览
          content:
            application/json:
              schema:
                type: object
                required: [code, data, msg]
                properties:
                  code: {type: integer, enum: [0]}
                  msg: {type: string}
                  data: {$ref: '#/components/schemas/BindingPreview'}
        "400": {description: invalid_argument，请求体格式、空 ID 或去重后镜头数量不在 1..100 范围内}
        "401": {description: unauthorized}
        "404": {description: not_found，项目、章节或任一目标镜头不存在或不属于当前用户}
        "500": {description: internal}
  /projects/{id}/units/{unitId}/shot-asset-bindings/append:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: path, name: unitId, required: true, schema: {type: string}}
    post:
      tags: [projects]
      summary: 原子追加章节存量镜头的资产版本引用并选择性失效过期产物
      description: |
        512 KiB 请求体上限。客户端提交的 baseline 为不可信期望快照；在 WithStoryboardAssetOwners 固定顺序 owner 锁与单数据库事务内重读项目、章节、基线全部 shotIds、当前关联目录及全部历史版本，重算服务端真实基线并按固定顺序校验：1）跨项目/跨章节镜头返回 42201；2）预览后已删除镜头返回 409；3）完整基线比对（projectRevision、shotIds、shots、catalog），若不一致则检查精确后态幂等（isStrictExpectedPostState），不匹配返回 409 storyboard_asset_binding_conflict；4）所选 assetVersionId 归属/关联/类别/状态（拒绝 deleting）及 RequireAssetVersionReferences 资源准入校验（无参考图的有效版本 missingImage=true 仍满足 bindable=true 并返回 200；仅 DefinitionJSON 显式引用的资源缺失/越权/非 ready/处于 deleting 时返回 42201）；5）单镜头不同版本容量上限 <= 6（42202）。
        当全部所选版本均已存在（totalIntendedAdded == 0）或满足 isStrictExpectedPostState 断网重放时，服务端执行零数据库写入/零失效/零修订号递增，返回 200 OK 且顶层与每镜均为 unchanged = true、addedCount = 0（每镜 addedVersionIds = []，携带当前最新 projectRevision、references 与 artifacts）。
        当存在真实新增引用（addedCount > 0）时，仅插入缺失的 (shot_id, asset_version_id) 行（role = "reference", status = "linked"）；仅将本次发生真实新增引用的镜头上全部非 failed 产物更新为 status = "stale" 且 selected = false（取消选中），已 failed 产物保持 status = "failed" 且将 selected 置为 false（保留历史产物记录与媒体文件，addedCount == 0 的未改动镜头产物完全不触碰），调用 invalidateUnitWorkflowTx 将章节 storyboard 之后的工作流阶段置为失效，并在同一事务内通过 project.revision CAS 递增项目修订号。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BindingAppendRequest'}
      responses:
        "200":
          description: 追加成功、全部已存在零写幂等或精确后态幂等重放
          content:
            application/json:
              schema:
                type: object
                required: [code, data, msg]
                properties:
                  code: {type: integer, enum: [0]}
                  msg: {type: string}
                  data: {$ref: '#/components/schemas/BindingAppendResult'}
        "400": {description: storyboard_asset_binding_invalid_request（code=400），请求格式、已归档项目、基线结构/升序约束、镜头范围（1..100）或 selections 覆盖/冲突不合法}
        "401": {description: unauthorized}
        "404": {description: not_found，项目或章节不存在或不属于当前用户}
        "409": {description: storyboard_asset_binding_conflict（code=409），目标镜头已删除、基线漂移且不满足精确后态幂等、项目 revision CAS 冲突或 owner 协调扩展重试耗尽}
        "422": {description: storyboard_asset_binding_invalid_reference（code=42201，目标镜头跨项目/章节，或基线未变但所选版本不存在/越权/未关联/类别不符/处于 deleting 状态，或版本 DefinitionJSON 显式引用的媒体资源不存在/越权/非 ready/处于 deleting 状态；仅无参考图的有效版本 missingImage=true 仍满足 bindable=true 并返回 200）或 storyboard_asset_binding_capacity_exceeded（code=42202，单镜头已有、所选或合并去重后的不同版本数超过 6）}
        "500": {description: internal}
        "503": {description: storyboard_asset_binding_busy（code=503），owner 协调 5s 锁预算或可重试数据库锁竞争耗尽}
  /projects/{id}/units/{unitId}/shots:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: path, name: unitId, required: true, schema: {type: string}}
    put:
      tags: [projects]
      summary: 原子替换章节镜头及版本引用
      description: |
        2 MiB 请求体上限。人工 replace 保持既有合同；章节生成必须携带 generatedBinding 和 expectedShotIds。
        同事务重读真实任务、完整基线、行脚本及合法版本子集。取消不发送写请求。
        rowIndices 与 shots 等长，无重复，索引对应真实任务行。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplaceProjectUnitShotsInput'}
      responses:
        "200": {description: '成功信封 data={shots: 保存后的镜头数组}'}
        "400": {description: invalid_argument，镜头数量/必填项/生成基线/脚本/行关联/版本子集/容量不符或已有镜头集合变化}
        "401": {description: unauthorized}
        "404": {description: not_found，项目、章节或生成任务不存在或不属于当前用户}
        "409": {description: conflict，项目归属变化或 owner 协调归属扩展重试耗尽}
        "500": {description: internal}
        "503": {description: unavailable，owner 协调预算或可重试锁失败}
  /projects/{id}/assets/{assetId}/profile-analyses:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, maxLength: 36}}
      - {in: path, name: assetId, required: true, schema: {type: string, maxLength: 80}}
    post:
      tags: [projects, assets]
      summary: 从已保存原始参考图创建档案分析草稿任务
      description: 严格 JSON（拒绝重复或未知键、多值），上限16 KiB；仅可信系统或逻辑视觉文本模型。创建不承诺幂等，断网先查询恢复，不自动重发收费请求。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersionId, sourceResourceId, modelSelection]
              properties:
                expectedVersionId: {type: string, minLength: 1, maxLength: 36}
                sourceResourceId: {type: string, minLength: 1, maxLength: 36}
                modelSelection:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [kind, logicalModelId]
                      properties:
                        kind: {type: string, enum: [logical]}
                        logicalModelId: {type: string, minLength: 1, maxLength: 36}
                    - type: object
                      additionalProperties: false
                      required: [kind, channelId, modelKey]
                      properties:
                        kind: {type: string, enum: [system]}
                        channelId: {type: string, minLength: 1, maxLength: 36}
                        modelKey: {type: string, minLength: 1, maxLength: 240}
      responses:
        "200": {description: '成功信封 data={analysis:ProfileAnalysisView}；不直接修改资产'}
        "400": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
        "422": {$ref: '#/components/responses/Error'}
    get:
      tags: [projects, assets]
      summary: 按目标资产恢复分析任务（全部状态，列表省略draft和baseline）
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {in: query, name: beforeTaskId, schema: {type: string, maxLength: 36}}
      responses:
        "200": {description: '成功信封 data={analyses:ProfileAnalysisView[],nextCursor?}，按createdAt和taskId倒序'}
        "400": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
  /projects/{id}/assets/{assetId}/profile-analyses/{taskId}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: path, name: assetId, required: true, schema: {type: string}}
      - {in: path, name: taskId, required: true, schema: {type: string}}
    get:
      tags: [projects, assets]
      summary: 查询安全分析详情；取消使用POST /tasks/{taskId}/cancel
      description: 'ProfileAnalysisView包含taskId/projectId/assetId/category/baseVersionId/source.resourceId/status/stage/createdAt/updatedAt/canCancel/canAdopt/currentVersionId/blockedReason，可选draft、baseline:{versionId,fields}、adoption(adoptedVersionId/selectedFields/adoptedAt)、error(reason/message)。baseline仅在专用详情投影任务绑定的已授权历史版本，versionId等于baseVersionId；fields只含角色appearance/physique/clothing/props或场景及道具description/prompt，保留原JSON类型及缺失键与null差异，不返回完整definition或收据。基准缺失/损坏时省略baseline，首次采用禁止，blockedReason为asset_profile_analysis_baseline_unavailable；已采用仍显示adoption，不以当前值替代基准。来源不可用时canAdopt为false。列表与通用任务不带baseline。draft同分类白名单且全部字符串；不返回原始模型流或收据摘要。清理任务后404，不重建草稿，仅采用接口支持既有持久收据的精确重放。'
      responses:
        "200": {description: '成功信封 data={analysis:ProfileAnalysisView}'}
        "404": {$ref: '#/components/responses/Error'}
  /projects/{id}/assets/{assetId}/profile-analyses/{taskId}/adopt:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: path, name: assetId, required: true, schema: {type: string}}
      - {in: path, name: taskId, required: true, schema: {type: string}}
    post:
      tags: [projects, assets]
      summary: 原子采用选中的非空草稿字段并创建新版本
      description: 严格JSON，上限8 KiB；值仅从服务端草稿取得。同一key和字段集重放先于基准及来源检查，返回原采用版本及最新资产摘要；任务已清理仍可使用既有持久收据精确重放。首次采用要求已授权且可读取的历史基准，缺失或损坏返回409和asset_profile_analysis_baseline_unavailable，不使用当前definition兜底。复制媒体保留原TaskID溯源，不改写为分析任务。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersionId, selectedFields, idempotencyKey]
              properties:
                expectedVersionId: {type: string, minLength: 1, maxLength: 36}
                selectedFields: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [appearance, physique, clothing, props, description, prompt]}}
                idempotencyKey: {type: string, minLength: 16, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
      responses:
        "200": {description: '成功信封 data={adoptedVersionId,replayed,asset:ProjectAssetSummary}'}
        "400": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
        "422": {$ref: '#/components/responses/Error'}
        "503": {$ref: '#/components/responses/Error'}
  /projects/{id}/asset-entities:
    post:
      tags: [projects, assets]
      summary: 原子创建场景或道具实体、首版本和目录关联
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name: {type: string, minLength: 1}
                category: {type: string, enum: [environment, prop]}
                definition: {type: object, additionalProperties: true}
                referenceImages:
                  type: array
                  maxItems: 16
                  items:
                    type: object
                    required: [resourceId]
                    properties:
                      resourceId: {type: string, minLength: 1}
                imageResourceId: {type: string, description: 可选直接采用成品，首版本原子绑定 primary}
                folderId: {type: string, description: 当前项目目录；不传或空字符串表示根目录}
      responses:
        "200": {description: '成功信封 data={asset}，包含可选 referenceImages'}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{id}/characters:
    post:
      tags: [projects, assets]
      summary: 创建项目角色及可选原图、直接成品和目录关联
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1}
                definition: {type: object, additionalProperties: true}
                referenceImages:
                  type: array
                  maxItems: 16
                  items:
                    type: object
                    required: [resourceId]
                    properties:
                      resourceId: {type: string, minLength: 1}
                imageResourceId: {type: string}
                imageRole: {type: string, enum: [portrait, turnaround_sheet], default: portrait, description: portrait 仅 primary；三视图同时写 primary 和 turnaround_sheet}
                folderId: {type: string}
      responses:
        "200": {description: '成功信封 data={asset,character}'}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{id}/characters/{assetId}:
    patch:
      tags: [projects, assets]
      summary: 编辑角色设定，保留原图和未编辑表现及声音
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: assetId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1}
                definition: {type: object, additionalProperties: true}
                expectedVersionId: {type: string, description: 新客户端须传；旧调用缺省仍执行内部版本 CAS}
      responses:
        "200": {description: '成功信封 data={asset,character}'}
        "400": {$ref: "#/components/responses/Error"}
        "409": {description: '版本冲突，reason=project_asset_version_changed'}
  /projects/{id}/characters/{assetId}/representations:
    put:
      tags: [projects, assets]
      summary: 替换角色图片表现并通过 CAS 创建新版本
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: assetId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [representations]
              properties:
                expectedVersionId: {type: string}
                representations:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items:
                    type: object
                    required: [role, resourceId]
                    properties:
                      role: {type: string, enum: [primary, front, side, back, turnaround_sheet, expression_sheet]}
                      resourceId: {type: string}
                      metadata: {type: object, additionalProperties: true}
      responses:
        "200": {description: '成功信封 data={asset,character}'}
        "400": {$ref: "#/components/responses/Error"}
        "409": {description: '版本冲突，reason=project_asset_version_changed'}
  /projects/{id}/assets/{assetId}/reference-images:
    put:
      tags: [projects, assets]
      summary: 设置版本化有序原始参考图数组（最多 16 张），支持重排与空数组清空且不覆盖成品
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: assetId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [referenceImages, expectedVersionId]
              properties:
                referenceImages:
                  type: array
                  maxItems: 16
                  items:
                    type: object
                    required: [resourceId]
                    properties:
                      resourceId: {type: string, minLength: 1}
                expectedVersionId: {type: string, minLength: 1}
      responses:
        "200": {description: '成功信封 data={asset}，referenceImages 为当前版本原图数组'}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {description: '版本冲突，reason=project_asset_version_changed'}
  /projects/{id}/assets/{assetId}/image-candidates/{taskId}/adopt:
    post:
      tags: [projects, assets]
      summary: 显式采用成功手动候选，原子推进版本并更新 adopted 状态
      description: 基准版本须等于请求预期版本和当前主版本；图片只能来自任务结果。同任务重试幂等，不回退当前版本。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: assetId, required: true, schema: {type: string}}
        - {in: path, name: taskId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersionId]
              properties:
                expectedVersionId: {type: string, minLength: 1}
      responses:
        "200": {description: '成功信封 data={asset}；任务结果 assetImageCandidate.state=adopted，含 adoptedVersionId'}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {description: '版本冲突，reason=project_asset_version_changed'}
  /projects/{id}/assets/{assetId}/image:
    put:
      tags: [projects, assets]
      summary: 为场景或道具绑定图片并创建新版本
      description: 校验项目归属、资产关联、版本归属与就绪图片资源；过期版本拒绝。旧版本与图片引用保留。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: assetId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceId, expectedVersionId]
              properties:
                resourceId: {type: string, minLength: 1}
                expectedVersionId: {type: string, minLength: 1}
      responses:
        "200":
          description: 成功信封 data={asset}，包含 visual.definition/status 和新版本、图片资源定位
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /projects/{id}/asset-generation-batches/preflight:
    post:
      tags: [projects, assets]
      summary: 项目资产批量生成预检与费用摘要
      description: 校验选中资产归属、版本一致性、参考图可用性与模型多图能力，返回已知积分费用汇总、未知价格项数量与 preflightDigest，不入队不扣费。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
      responses:
        "200": {description: "成功信封 data=ProjectAssetBatchPreflightResult"}
        "400": {$ref: "#/components/responses/Error"}
        "409": {description: "版本冲突，reason=project_asset_version_changed"}
  /projects/{id}/asset-generation-batches:
    post:
      tags: [projects, assets]
      summary: 幂等提交项目资产批量生成批次
      description: 按 idempotencyKey 与 preflightDigest 持久化批次与生成项，并按项目图片手动候选模式分派单图任务。同键同参幂等返回已有批次与任务，同键异参返回 409 reason=batch_idempotency_conflict，预检过期返回 409 reason=batch_preflight_stale。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey, preflightDigest, items]
      responses:
        "200": {description: "成功信封 data={batch}"}
        "400": {$ref: "#/components/responses/Error"}
        "409": {description: "幂等冲突或预检过期"}
    get:
      tags: [projects, assets]
      summary: 查询当前用户在该项目下的批量生成批次列表
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: limit, required: false, schema: {type: integer}}
      responses:
        "200": {description: "成功信封 data={batches}"}
  /projects/{id}/asset-generation-batches/{batchId}:
    get:
      tags: [projects, assets]
      summary: 获取单个项目资产批量生成批次详情与各项状态
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: batchId, required: true, schema: {type: string}}
      responses:
        "200": {description: "成功信封 data={batch}"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{id}/asset-generation-batches/{batchId}/stop:
    post:
      tags: [projects, assets]
      summary: 停止批次中尚未派发的待提交项
      description: 仅将尚未绑定 taskId 的 pending 项原子更新为 stopped，阻止后续派发与扣费；不影响已入队或运行中的任务。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: batchId, required: true, schema: {type: string}}
      responses:
        "200": {description: "成功信封 data={batch}"}
  /projects/{id}/asset-generation-batches/{batchId}/cancel-tasks:
    post:
      tags: [projects, assets]
      summary: 请求取消批次中已提交的活动任务
      description: 先停止未派发项，再对 queued/running 的关联任务发起取消；已成功产出的手动候选保持不变。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: batchId, required: true, schema: {type: string}}
      responses:
        "200": {description: "成功信封 data={batch}"}
  /projects/{id}/asset-generation-batches/{batchId}/items/{itemId}/retry:
    post:
      tags: [projects, assets]
      summary: 重试批次中已确认失败的单个生成项
      description: 仅允许对 status=failed 且无待恢复媒体或候选的项发起重试；将旧 taskId 归档进 attemptHistoryJSON，递增 attempt 并创建新任务。reconcile_required 禁止盲目重试。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: batchId, required: true, schema: {type: string}}
        - {in: path, name: itemId, required: true, schema: {type: string}}
      responses:
        "200": {description: "成功信封 data={batch}"}
        "400": {$ref: "#/components/responses/Error"}
  /admin/login-logs:
    get:
      tags: [admin]
      summary: 管理员分页查询用户登录登出日志
      description: 按时间倒序，保留用户快照；失败账号脱敏，无密码、验证码或会话凭据。
      parameters:
        - {in: query, name: keyword, schema: {type: string, maxLength: 160}, description: 用户名、昵称、脱敏账号或用户 ID}
        - {in: query, name: event, schema: {type: string, enum: [login, logout]}}
        - {in: query, name: method, schema: {type: string, enum: [password, email, sms, linuxdo, verification, unknown]}}
        - {in: query, name: result, schema: {type: string, enum: [success, failed]}}
        - {in: query, name: ip, schema: {type: string}, description: 精确匹配 IPv4 或 IPv6}
        - {in: query, name: from, schema: {type: string, format: date-time}, description: 包含开始时刻，RFC3339}
        - {in: query, name: to, schema: {type: string, format: date-time}, description: 包含结束时刻，RFC3339}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, default: 20}}
      responses:
        "200":
          description: 成功信封 data={logs,total,page,pageSize}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  msg: {type: string}
                  data:
                    type: object
                    properties:
                      logs: {type: array, items: {$ref: "#/components/schemas/LoginLog"}}
                      total: {type: integer}
                      page: {type: integer}
                      pageSize: {type: integer}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /admin/login-logs/{id}:
    get:
      tags: [admin]
      summary: 管理员读取单条登录日志详情
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200":
          description: 成功信封 data.log
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  msg: {type: string}
                  data:
                    type: object
                    properties:
                      log: {$ref: "#/components/schemas/LoginLog"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /admin/settings/appearance/live2d:
    post:
      tags: [admin]
      summary: 导入管理员 Live2D 模型草稿（不自动启用）
      description: ZIP 最大 128 MiB，最多 256 条目；解压累计 384 MiB，单文件最大 128 MiB。只接受一个 Version 3 model3.json 及 ZIP 内 MOC3、PNG、JSON 引用。启用通过 PATCH /admin/settings/appearance 的 canvas 配置完成。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200":
          description: 成功信封 data.model 包含 resourceId 和服务端确认的 entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  msg: {type: string}
                  data:
                    type: object
                    properties:
                      model:
                        type: object
                        required: [resourceId, entry]
                        properties:
                          resourceId: {type: string}
                          entry: {type: string}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /admin/settings/appearance/live2d/{id}/{file}:
    get:
      tags: [admin]
      summary: 读取模型草稿文件（管理员所有者或当前配置引用）
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: file, required: true, description: ZIP 内相对路径，可包含多级目录, schema: {type: string}}
      responses:
        "200": {description: JSON、PNG 或 MOC3 文件，非 JSON 信封}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /public/appearance/live2d/{id}/{file}:
    get:
      tags: [meta]
      security: []
      summary: 读取当前启用的 Live2D 模型文件
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: file, required: true, description: ZIP 内相对路径，可包含多级目录, schema: {type: string}}
      responses:
        "200": {description: JSON、PNG 或 MOC3 文件，非 JSON 信封；停用后拒绝公开读取}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/settings/appearance/avatar-bundles:
    post:
      tags: [admin]
      summary: 导入 Agent 状态动画 ZIP 草稿（不自动启用）
      description: ZIP 最大 128 MiB，解压累计最大 384 MiB、最多 128 个条目；根目录须包含 version 1 的 avatar.json 和其引用的 MP4。上传后需通过 PATCH /admin/settings/appearance 配置 avatarBundleResourceId 与 avatarClipStates 才会公开播放。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200":
          description: 成功信封 data.bundle 包含 resourceId 和已校验 manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  msg: {type: string}
                  data:
                    type: object
                    properties:
                      bundle:
                        type: object
                        required: [resourceId, manifest]
                        properties:
                          resourceId: {type: string}
                          manifest:
                            type: object
                            required: [version, width, height, clips]
                            properties:
                              version: {type: integer, enum: [1]}
                              width: {type: integer, minimum: 1, maximum: 4096}
                              height: {type: integer, minimum: 1, maximum: 4096}
                              clips: {type: object, additionalProperties: {type: string}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /admin/settings/appearance/avatar/{id}/{file}:
    get:
      tags: [admin]
      summary: 预览动画包文件（上传者或当前配置引用的管理员）
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: file, required: true, description: avatar.json 或 manifest 引用的 MP4 文件名, schema: {type: string}}
      responses:
        "200": {description: JSON 或 MP4 原始内容，支持 MP4 Range 请求}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /public/appearance/avatar/{id}/{file}:
    get:
      tags: [meta]
      security: []
      summary: 读取当前启用的 Agent 动画包文件
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: file, required: true, description: avatar.json 或 manifest 引用的 MP4 文件名, schema: {type: string}}
      responses:
        "200": {description: JSON 或 MP4 原始内容，支持 Range；停用后拒绝公开读取}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /tools:
    get:
      tags: [canvas]
      summary: 列出可见且启用的生成工具
      parameters:
        - {in: query, name: scope, schema: {type: string, enum: [public, favorites, custom], default: public}}
        - {in: query, name: type, schema: {type: string, enum: [style, motion, nine_grid, effect]}}
        - {in: query, name: tag, schema: {type: string}}
        - {in: query, name: search, schema: {type: string}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 80, default: 20}}
      responses:
        "200": {description: "标准信封 data 为 tools（摘要不含 prompt/extraInfo）、totalCount、page、pageSize、hasMore"}
        "401": {description: 未登录}
    post:
      tags: [canvas]
      summary: 创建当前用户的工具
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolMutation'}
      responses:
        "200": {description: 标准信封 data 为完整工具}
        "400": {description: 参数无效或预览资源不符合要求}
        "401": {description: 未登录}
  /skills/presets:
    get:
      tags: [canvas]
      security: []
      summary: 获取公开场景技能预设目录
      responses:
        "200":
          description: 标准信封 data 为 presets 数组；预设只引用公开且启用的种子技能
        "500": {$ref: "#/components/responses/Error"}
  /skills:
    get:
      tags: [skills]
      summary: 列出技能；在个人技能视图按技能库分类筛选
      parameters:
        - {in: query, name: scope, schema: {type: string, enum: [public, mine, created, favorites], default: public}}
        - {in: query, name: libraryCategoryId, description: 用户技能库分类 ID，仅支持 mine 或 created 视图；与 libraryUncategorized 互斥, schema: {type: string}}
        - {in: query, name: libraryUncategorized, description: 仅列出未归类技能，仅支持 mine 或 created 视图；与 libraryCategoryId 互斥, schema: {type: boolean}}
      responses:
        "200": {description: 标准信封 data 为技能列表及分页信息；categories 含共享分类 value、label 和技能广场公开技能 count}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /skills/library-categories:
    get:
      tags: [skills]
      summary: 获取当前用户可见的技能库分类和数量
      parameters:
        - {in: query, name: scope, schema: {type: string, enum: [mine, created], default: mine}}
      responses:
        "200": {description: 标准信封 data 为 categories、totalCount、uncategorizedCount；分类含 id、name、scope、count}
        "401": {$ref: "#/components/responses/Error"}
    post:
      tags: [skills]
      summary: 创建个人或平台技能库分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 64}
                scope: {type: string, enum: [personal, platform], default: personal}
      responses:
        "200": {description: 标准信封 data.category 为新分类}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /skills/library-categories/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    delete:
      tags: [skills]
      summary: 删除技能库分类并解除相关技能归类，不删除技能
      responses:
        "200": {description: "标准信封 data 为 {deleted: true}"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /skills/{id}/library-category:
    parameters:
      - {in: path, name: id, required: true, description: 技能 ID, schema: {type: string}}
    patch:
      tags: [skills]
      summary: 为当前用户已加入或自建的技能设置/清除技能库分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId]
              properties:
                categoryId: {type: string, description: 个人分类或可见平台分类 ID；空字符串表示取消归类}
      responses:
        "200": {description: 标准信封 data.skill 为更新后的技能}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /tools/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      tags: [canvas]
      summary: 查询可见且启用工具的完整详情
      responses:
        "200": {description: 标准信封 data 为完整工具，包含 prompt 和 extraInfo}
        "404": {description: 工具不存在或不可见}
    delete:
      tags: [canvas]
      summary: 删除自己的用户工具及关联收藏，不删除预览文件
      responses:
        "200": {description: "标准信封 data 为 {deleted: true}"}
        "404": {description: 工具不存在或不能删除}
  /tools/{id}/favorite:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
    post:
      tags: [canvas]
      summary: 幂等收藏可见工具
      responses:
        "200": {description: 标准信封 data 为完整工具和收藏状态}
        "404": {description: 工具不存在或不可见}
    delete:
      tags: [canvas]
      summary: 幂等取消收藏可见工具
      responses:
        "200": {description: 标准信封 data 为完整工具和收藏状态}
        "404": {description: 工具不存在或不可见}
  /model-catalog:
    get:
      tags: [models]
      summary: 获取创作端模型目录
      description: |
        固定 source=system，channels 直接来自系统渠道下的模型列表，models 为空数组；不反查逻辑模型。
        一级跨渠道按 displayName 分组，二级显示 channelLabel；模型请求仍使用 channelId + modelKey 定位。
        channelLabel 是后台渠道模型创建和更新时配置的渠道展示名，去除首尾空白后最多 80 字，空字符串表示使用所属渠道名称。
        description 是后台渠道模型创建和更新时填写的公开模型描述，去除首尾空白后最多 500 字；空字符串表示未填写。
        displayName 和 icon 用于一级模型菜单，channelLabel 不参与路由、权限或计费。
        渠道级 publicAlias 已废弃；成本配置和成本快照仅供管理端，不包含在本接口及用户报价中。
      responses:
        "200":
          description: 当前启用的模型目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum: [0]
                  msg:
                    type: string
                  data:
                    type: object
                    required: [source, models, channels]
                    properties:
                      source:
                        type: string
                        enum: [system]
                      models:
                        type: array
                        items:
                          type: object
                      channels:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            displayName:
                              type: string
                            models:
                              type: array
                              items:
                                type: object
                                properties:
                                  modelKey:
                                    type: string
                                  displayName:
                                    type: string
                                  icon:
                                    type: string
                                  channelLabel:
                                    type: string
                                    maxLength: 80
                                    default: ""
                                  tags:
                                    type: array
                                    maxItems: 5
                                    description: 后台模型创建及更新使用同名字段；文字去除首尾空白且不能重复，空数组清除标签，仅用于展示。
                                    items:
                                      type: object
                                      required: [text, color]
                                      properties:
                                        text:
                                          type: string
                                          minLength: 1
                                          maxLength: 12
                                        color:
                                          type: string
                                          enum: [purple, blue, green, gold, orange, pink]
                                  description:
                                    type: string
                                    maxLength: 500
                                    default: ""
        "401":
          $ref: "#/components/responses/Error"
  /model-catalog/quote:
    post:
      tags: [models]
      summary: 按当前参数预估系统渠道模型费用
      description: |
        需要登录会话 Cookie。仅接受启用的系统渠道和模型，采用服务端能力默认值及价格档选择规则。
        不创建任务或账单、不冻结或扣除积分，也不调用模型供应商。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, modelKey, intent]
              properties:
                channelId:
                  type: string
                  minLength: 1
                modelKey:
                  type: string
                  minLength: 1
                  description: 系统渠道中配置的模型键
                intent:
                  $ref: "#/components/schemas/ModelRequestIntent"
      responses:
        "200":
          $ref: "#/components/responses/ModelQuote"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /models/{id}/quote:
    post:
      tags: [models]
      summary: 按当前参数预估前台模型费用
      description: |
        需要登录会话 Cookie。请求正文直接为创作意图，不使用 intent 外层包装。
        服务端按前台模型能力、默认参数、供应线路和价格策略报价，不创建任务、账单或积分冻结。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: 前台逻辑模型 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRequestIntent"
      responses:
        "200":
          $ref: "#/components/responses/ModelQuote"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /canvas-projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取当前用户画布内容和 revision
      responses:
        "200":
          description: 信封 data.project 包含完整画布及服务端 revision
        "304":
          description: If-None-Match 命中当前 revision，正文为空
        "404":
          description: 画布不存在或不属于当前用户
    delete:
      tags: [canvas]
      summary: 显式删除当前用户画布
      description: 删除后迟到的媒体回写和编辑操作不会重新创建画布；只有新的 create_canvas operation 可以显式创建同 ID 画布。
      responses:
        "200":
          description: 画布已删除，信封 data.id 返回画布 ID
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
  /canvas-projects/{id}/revisions/{revision}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: revision
        required: true
        schema: { type: integer, minimum: 1, maximum: 9007199254740991 }
    get:
      tags: [canvas]
      summary: 读取当前用户现存画布的指定版本基线
      description: 只读当前版本或该版本的完整操作回执，不回滚画布、不重新执行操作。客户端必须核对内容哈希后才能用于三方合并。
      responses:
        "200":
          description: 信封 data.project 包含指定版本的完整画布；Cache-Control 为 private, no-store
        "400":
          description: 版本不是正安全整数
        "401":
          description: 未登录
        "404":
          description: 当前画布不存在、无权访问、指定版本不存在或回执缺少完整文档
        "500":
          description: 历史回执损坏，禁止作为合并基线
  /canvas-projects/{id}/sync-status:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取当前用户画布版本、输入租约及 Agent 占用状态
      description: 需要登录并拥有画布。仅返回 revision、服务端时间、有效租约和 Agent 控制字段，不返回 token、完整画布或 Agent 对话正文；WebSocket 通知后校验状态，连接正常且无活动 Agent 时每三十秒补偿读取，断线或活动 Agent 期间恢复前台两秒、后台十五秒非重叠查询。版本变化后再读取正文。
      responses:
        "200":
          description: 信封 data 含 revision、serverTime、leases 和可空的 agent；每项租约含 nodeId、sessionId、expiresAt，agent 只含 runId、status、cleanupPending
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
  /canvas-projects/{id}/realtime:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 建立画布多窗口光标、拖拽预览与同步通知 WebSocket
      description: 使用登录 Cookie，校验画布归属和 Origin。welcome 返回 selfId/peers，每个 peer 包含服务端分配的 number（1–64），同一会话在各窗口编号一致且存续期间不变；Redis 模式跨实例分配并续期临时编号。客户端发送世界坐标 presence，服务端广播 peer/leave/invalidate/heartbeat。光标与拖拽预览不入库，invalidate 只在事务提交后发送，收到后通过 sync-status 校准。协议细节见画布操作同步专题。
      responses:
        "101":
          description: 已升级到 WebSocket
        "401":
          description: 未登录
        "403":
          description: 来源不允许
        "404":
          description: 画布不存在或不属于当前用户
        "503":
          description: 实时服务暂不可用，客户端保留 HTTP 同步
  /canvas-projects/{id}/edit-lease:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [canvas]
      summary: 获取、续期或释放节点文字编辑租约
      description: 需要登录并拥有画布。服务端有效期 30 秒，实际输入才获取；续期与释放必须携带当前 token。请求最大 2048 字节，每用户每分钟最多 240 次；过期持有者不能影响新持有者。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, nodeId, sessionId]
              properties:
                action:
                  type: string
                  enum: [acquire, renew, release]
                nodeId:
                  type: string
                  minLength: 1
                  maxLength: 160
                sessionId:
                  type: string
                  minLength: 1
                  maxLength: 160
                token:
                  type: string
                  maxLength: 80
      responses:
        "200":
          description: 信封 data 含 serverTime；获取及续期额外返回 lease 和 token，释放不返回 token
        "400":
          description: 参数无效
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
        "409":
          description: reason 为 canvas_edit_lease_conflict；节点被其他窗口占用或证明已过期
        "429":
          description: 请求超过频率限制
  /canvas-projects/{id}/operations:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [canvas]
      summary: 按对象或字段变更写入画布
      description: |
        请求只提交对象级或字段级 operations，不提交整批画布快照。
        mutationId 是一次请求的幂等身份；响应丢失、断网、刷新或后台重试时必须复用同一个 mutationId 与原始 operations。
        更新、删除和连接操作要求目标存在并通过对象基线校验；同一字段冲突不会覆盖远端修改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mutationId, operations]
              properties:
                mutationId:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: 一次写入请求的幂等身份
                baseRevision:
                  type: integer
                  format: int64
                  minimum: 0
                  description: 生成 operations 时已确认的画布 revision，用于诊断和响应
                editProofs:
                  type: array
                  maxItems: 500
                  description: 本次修改涉及节点的编辑证明，节点不可重复；不计入 mutation 摘要，原请求 receipt 可在租约过期后重放
                  items:
                    type: object
                    required: [nodeId, sessionId, token]
                    properties:
                      nodeId: { type: string, minLength: 1, maxLength: 160 }
                      sessionId: { type: string, minLength: 1, maxLength: 160 }
                      token: { type: string, minLength: 1, maxLength: 80 }
                operations:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [type]
                    additionalProperties: true
                    description: create_canvas、create_node、patch_node、remove_node、create_connection、update_connection、remove_connection 或 set_field
      responses:
        "200":
          description: 信封 data.project 返回当前画布摘要，data.mutationId 返回原 mutationId
        "400":
          description: 请求、字段、对象基线或素材引用格式不合法
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户，且请求未包含显式 create_canvas
        "409":
          description: 对象并发冲突、同一 mutationId 对应的请求摘要不同或编辑证明失效（reason 为 canvas_edit_lease_conflict）；原事务不会被覆盖
        "428":
          description: 缺少执行所需的对象基线
  /public/welcome:
    get:
      tags: [meta]
      security: []
      summary: 读取欢迎页开放状态
      responses:
        "200":
          description: 信封 data 仅包含 welcomeEnabled 布尔值，默认 true；Cache-Control 为 no-store
        "500":
          description: 配置读取失败
  /agent/capabilities:
